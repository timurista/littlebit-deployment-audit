<title id="storage-resident-title">Resident unique tensor bytes after loading (FP32)</title>
<desc id="storage-resident-desc">Stacked bars of resident unique FP32 tensor bytes: original 1,976,131,200 bytes, pilot student 1,234,703,616 bytes.</desc>
