<text x="303.75" y="294" font-size="11" text-anchor="middle" fill="#555B69">10<tspan dy="-5" font-size="8">1</tspan></text>
<line x1="347.5" y1="70" x2="347.5" y2="278" stroke="#D8D1C1" stroke-width="1"/>
<text x="347.5" y="294" font-size="11" text-anchor="middle" fill="#555B69">10<tspan dy="-5" font-size="8">2</tspan></text>
<line x1="391.25" y1="70" x2="391.25" y2="278" stroke="#D8D1C1" stroke-width="1"/>
<text x="391.25" y="294" font-size="11" text-anchor="middle" fill="#555B69">10<tspan dy="-5" font-size="8">3</tspan></text>
<line x1="435" y1="70" x2="435" y2="278" stroke="#D8D1C1" stroke-width="1"/>
