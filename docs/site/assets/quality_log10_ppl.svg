<text x="16" y="256" font-size="11" text-anchor="start" font-weight="400" fill="#9C4A1A">decoder defect condition, not a quality result</text>
<rect x="260" y="228" width="312.03" height="22" fill="url(#defect-hatch)" stroke="#9C4A1A" stroke-width="1.5" stroke-dasharray="5 3" data-key="ppl.qat_trained_upstream_decoder" data-value="13558558.490179988" data-log10="7.132214"/>
<text x="580.03" y="244" font-size="12" text-anchor="start" font-weight="600" fill="#14213D">13,558,558.4902</text>
<line x1="260" y1="70" x2="260" y2="278" stroke="#14213D" stroke-width="1.2"/>
<text x="16" y="338" font-size="11" text-anchor="start" font-weight="400" fill="#555B69">Source: results/summary.json (heldout_test). The hatched bar reloads the same QAT weights with the shipped unpacker.</text>
</svg>
