<text x="16" y="156" font-size="11" text-anchor="start" font-weight="400" fill="#555B69">converted, no QAT</text>
<rect x="260" y="128" width="215.08" height="22" fill="#7C88A8" data-key="ppl.initialized_no_qat" data-value="82426.33720523083" data-log10="4.916066"/>
