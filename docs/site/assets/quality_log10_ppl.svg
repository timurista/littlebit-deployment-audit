<text x="478.75" y="294" font-size="11" text-anchor="middle" fill="#555B69">10<tspan dy="-5" font-size="8">5</tspan></text>
<line x1="522.5" y1="70" x2="522.5" y2="278" stroke="#D8D1C1" stroke-width="1"/>
<text x="522.5" y="294" font-size="11" text-anchor="middle" fill="#555B69">10<tspan dy="-5" font-size="8">6</tspan></text>
