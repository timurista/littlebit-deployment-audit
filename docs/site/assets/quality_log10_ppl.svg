<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="quality-log10-ppl-title quality-log10-ppl-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" data-chart="quality-log10-ppl">
<title id="quality-log10-ppl-title">Held-out perplexity on a log10 scale</title>
<desc id="quality-log10-ppl-desc">Horizontal bars of log10 perplexity on the same 8 held-out windows (1,016 scored tokens): Original model 28.8816; LittleBit, initialized 82,426.3372; LittleBit, 16 QAT steps 9,735.6350; Same QAT weights, defective decoder 13,558,558.4902.</desc>
<rect width="720" height="350" fill="#FBF8F1"/>
<defs><pattern id="defect-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FBF8F1"/><line x1="0" y1="0" x2="0" y2="7" stroke="#9C4A1A" stroke-width="3"/></pattern></defs>
<text x="16" y="28" font-size="16" text-anchor="start" font-weight="700" fill="#14213D">Held-out perplexity, log10 scale</text>
<text x="16" y="48" font-size="12" text-anchor="start" font-weight="400" fill="#555B69">Same 8 WikiText-2 test windows, 1,016 scored tokens. Lower is better. Tiny pilot, one seed, one run.</text>
<line x1="16" y1="58" x2="704" y2="58" stroke="#D8D1C1" stroke-width="1"/>
<line x1="260" y1="70" x2="260" y2="278" stroke="#D8D1C1" stroke-width="1"/>
