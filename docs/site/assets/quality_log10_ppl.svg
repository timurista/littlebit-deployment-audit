<text x="435" y="312" font-size="11" text-anchor="middle" font-weight="400" fill="#555B69">perplexity (log10 axis; each gridline is 10 times the previous)</text>
<text x="16" y="90" font-size="13" text-anchor="start" font-weight="600" fill="#14213D">Original model</text>
<text x="16" y="106" font-size="11" text-anchor="start" font-weight="400" fill="#555B69">reference, FP32</text>
<rect x="260" y="78" width="63.9" height="22" fill="#14213D" data-key="ppl.original" data-value="28.881594011091973" data-log10="1.460621"/>
