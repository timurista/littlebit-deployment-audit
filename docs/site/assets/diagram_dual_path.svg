<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="dual-path-diagram-title dual-path-diagram-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" data-chart="dual-path-diagram">
<title id="dual-path-diagram-title">Structure of the dual-path binary low-rank layer (illustrative)</title>
<desc id="dual-path-diagram-desc">Structural diagram, not data. Input x enters a main path and a residual path. Each path computes y = ((((x * v2) @ Vq.T) * (v1 * u2)) @ Uq.T) * u1 with its own binary sign matrices and scale vectors; the two path outputs are added together with the bias to give y. No dimension or value in this diagram is measured.</desc>
<rect width="960" height="360" fill="#FBF8F1"/>
<text x="16" y="28" font-size="16" text-anchor="start" font-weight="700" fill="#14213D">Dual-path binary low-rank layer: structure only</text>
<text x="16" y="48" font-size="12" text-anchor="start" font-weight="400" fill="#555B69">Upstream LittleBitLinear at commit 933857e. Shapes are symbolic; nothing here is measured.</text>
<line x1="16" y1="58" x2="944" y2="58" stroke="#D8D1C1" stroke-width="1"/>
<text x="16" y="82" font-size="13" text-anchor="start" font-weight="600" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">y = ((((x * v2) @ Vq.T) * (v1 * u2)) @ Uq.T) * u1   (main path)</text>
<text x="16" y="100" font-size="13" text-anchor="start" font-weight="400" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">+ the same with U_R, V_R, u1_R, u2_R, v1_R, v2_R (residual path)  + bias</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213D"/></marker></defs>
<rect x="16" y="186" width="70" height="44" rx="6" fill="#FBF8F1" stroke="#14213D"/>
<text x="51" y="213" font-size="15" text-anchor="middle" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x</text>
<text x="51" y="246" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">input, d_in</text>
<text x="130" y="138" font-size="11" text-anchor="start" font-weight="700" fill="#555B69">main path</text>
<path d="M86,208 C108,208 108,172 128,172" fill="none" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="130" y="150" width="118" height="44" rx="6" fill="#FBF8F1" stroke="#0F7C7A" stroke-width="1.6"/>
<text x="189" y="170" font-size="12" text-anchor="middle" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">* v2</text>
<text x="189" y="186" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">scale vector</text>
<text x="189" y="208" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">length d_in</text>
<line x1="248" y1="172" x2="272" y2="172" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="274" y="150" width="118" height="44" rx="6" fill="#FBF8F1" stroke="#2747B8" stroke-width="1.6"/>
<text x="333" y="170" font-size="12" text-anchor="middle" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@ Vq.T</text>
<text x="333" y="186" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">binary signs, packed</text>
<text x="333" y="208" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">s x d_in, +1 or -1</text>
<line x1="392" y1="172" x2="416" y2="172" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="418" y="150" width="118" height="44" rx="6" fill="#FBF8F1" stroke="#0F7C7A" stroke-width="1.6"/>
<text x="477" y="170" font-size="12" text-anchor="middle" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">* (v1 * u2)</text>
<text x="477" y="186" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">two scale vectors</text>
<text x="477" y="208" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">length s</text>
<line x1="536" y1="172" x2="560" y2="172" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="562" y="150" width="118" height="44" rx="6" fill="#FBF8F1" stroke="#2747B8" stroke-width="1.6"/>
<text x="621" y="170" font-size="12" text-anchor="middle" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@ Uq.T</text>
<text x="621" y="186" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">binary signs, packed</text>
<text x="621" y="208" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">d_out x s, +1 or -1</text>
<line x1="680" y1="172" x2="704" y2="172" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="706" y="150" width="118" height="44" rx="6" fill="#FBF8F1" stroke="#0F7C7A" stroke-width="1.6"/>
<text x="765" y="170" font-size="12" text-anchor="middle" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">* u1</text>
<text x="765" y="186" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">scale vector</text>
<text x="765" y="208" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">length d_out</text>
<path d="M824,172 C864,172 864,228 856,228" fill="none" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="130" y="250" font-size="11" text-anchor="start" font-weight="700" fill="#555B69">residual path</text>
<path d="M86,208 C108,208 108,284 128,284" fill="none" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="130" y="262" width="118" height="44" rx="6" fill="#FBF8F1" stroke="#0F7C7A" stroke-width="1.6"/>
<text x="189" y="282" font-size="12" text-anchor="middle" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">* v2_R</text>
<text x="189" y="298" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">scale vector</text>
<text x="189" y="320" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">length d_in</text>
<line x1="248" y1="284" x2="272" y2="284" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="274" y="262" width="118" height="44" rx="6" fill="#FBF8F1" stroke="#2747B8" stroke-width="1.6"/>
<text x="333" y="282" font-size="12" text-anchor="middle" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@ Vq_R.T</text>
<text x="333" y="298" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">binary signs, packed</text>
<text x="333" y="320" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">s x d_in, +1 or -1</text>
<line x1="392" y1="284" x2="416" y2="284" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="418" y="262" width="118" height="44" rx="6" fill="#FBF8F1" stroke="#0F7C7A" stroke-width="1.6"/>
<text x="477" y="282" font-size="12" text-anchor="middle" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">* (v1_R * u2_R)</text>
<text x="477" y="298" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">two scale vectors</text>
<text x="477" y="320" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">length s</text>
<line x1="536" y1="284" x2="560" y2="284" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="562" y="262" width="118" height="44" rx="6" fill="#FBF8F1" stroke="#2747B8" stroke-width="1.6"/>
<text x="621" y="282" font-size="12" text-anchor="middle" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">@ Uq_R.T</text>
<text x="621" y="298" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">binary signs, packed</text>
<text x="621" y="320" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">d_out x s, +1 or -1</text>
<line x1="680" y1="284" x2="704" y2="284" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="706" y="262" width="118" height="44" rx="6" fill="#FBF8F1" stroke="#0F7C7A" stroke-width="1.6"/>
<text x="765" y="282" font-size="12" text-anchor="middle" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">* u1_R</text>
<text x="765" y="298" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">scale vector</text>
<text x="765" y="320" font-size="10" text-anchor="middle" font-weight="400" fill="#555B69">length d_out</text>
<path d="M824,284 C864,284 864,228 856,228" fill="none" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<circle cx="872" cy="228" r="14" fill="#FBF8F1" stroke="#14213D" stroke-width="1.6"/>
<text x="872" y="233" font-size="16" text-anchor="middle" font-weight="700" fill="#14213D">+</text>
<text x="872" y="260" font-size="11" text-anchor="middle" font-weight="400" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">+ bias</text>
<line x1="886" y1="228" x2="916" y2="228" stroke="#14213D" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="928" y="233" font-size="15" text-anchor="start" font-weight="700" fill="#14213D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">y</text>
<text x="16" y="348" font-size="11" text-anchor="start" font-weight="400" fill="#555B69">Structure only: d_in, s and d_out are symbols, not measured sizes. The packed format stores Uq and Vq as 32-bit words.</text>
</svg>
